<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="m-0 p-0 bg-[hsl(47,88%,63%)] min-h-screen flex flex-col justify-center items-center">

  <main class=" bg-white max-w-[375px] rounded-2xl p-[24px] border border-black shadow-[8px_8px_0px_rgba(0,0,0,0.9)] my-auto">
    
      <img src="./assets/images/illustration-article.svg" alt="Article Illustration" class="rounded-xl w-full">

      <div class="py-4 ">
        <h3 class="text-sm font-semibold p-2 bg-[hsl(47,88%,63%)] w-24 text-center rounded-lg">Learning</h3>

        <p class="font-medium my-[10px]">Published 21 Dec 2023</p>

        <h1 class="text-xl font-bold my-[16px] cursor-pointer hover:text-[hsl(47,88%,63%)] transition-colors">HTML & CSS foundations</h1>

        <p class="text-gray-700 text-sm mb-[20px]">These languages are the backbone of every website, defining structure, content, and presentation.</p>

        <div class="flex items-center text-sm">
          <img src="./assets/images/image-avatar.webp" alt="Photo avatar" class="w-8  mr-4">
          <h2 class="font-semibold">Greg Hooper</h2>
        </div>
    </div>

  </main>
  

  <footer class="attribution hidden">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">MOhamed Yacine</a>.
  </footer>
</body>
</html>
