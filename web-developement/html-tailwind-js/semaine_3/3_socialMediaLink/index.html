<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="m-0 p-0 bg- bg-[hsl(0,0%,8%)] min-h-screen flex flex-col items-center justify-center">

  <main class=" max-w-[375px] bg-[hsl(0,0%,12%)] w-full  rounded-xl flex flex-col text-white my-auto p-8">
    
    <img src="./assets/images/avatar-jessica.jpeg" alt="Jessica Picture" class="rounded-full w-24 mx-auto my-[18px]">
    
    <div class="text-center m-[20px]">

      <h1 class="text-2xl font-semibold my-2 text-white">Jessica Randall</h1>
      <p class="text-sm font-bold text-[hsl(75,94%,57%)]">London, Unit5ed Kingdom</p>

      <p class="text-sm my-[26px] text-gray-300">
        "Front-end developer and avid reader."
      </p>



      <nav class="">
        <ul class="text-sm font-semibold">
          <li class="bg-[hsl(0,0%,20%)] py-2 rounded-md my-[18px] hover:bg-[hsl(75,94%,57%)] transition-colors cursor-pointer"><a href="">GitHub</a></li>
          <li class="bg-[hsl(0,0%,20%)] py-2 rounded-md my-[18px] hover:bg-[hsl(75,94%,57%)] transition-colors cursor-pointer"><a href="">Frontend Mentor</a></li>
          <li class="bg-[hsl(0,0%,20%)] py-2 rounded-md my-[18px] hover:bg-[hsl(75,94%,57%)] transition-colors cursor-pointer"><a href="">LinkedIn</a></li>
          <li class="bg-[hsl(0,0%,20%)] py-2 rounded-md my-[18px] hover:bg-[hsl(75,94%,57%)] transition-colors cursor-pointer"><a href="">Twitter</a></li>
          <li class="bg-[hsl(0,0%,20%)] py-2 rounded-md hover:bg-[hsl(75,94%,57%)] transition-colors cursor-pointer"><a href="">Instagram</a></li>
        </ul>
      </nav>
    </div>
      
  </main>
  
  <footer class="attribution text-white hidden">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">M0hamed Yacine</a>.
  </footer>
</body>
</html>
