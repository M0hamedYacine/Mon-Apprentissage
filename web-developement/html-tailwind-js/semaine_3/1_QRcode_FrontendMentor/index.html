<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Frontend Mentor | QR code component</title>
</head>
<body class="m-0 p-0 bg-[hsl(212,45%,89%)] flex flex-col min-h-screen items-center justify-center p-4">

  <div class="bg-white p-4 rounded-2xl shadow-xl w-full max-w-[360px] text-center">
    <img src="./images/image-qr-code.png" alt="QR Code" class="rounded-xl w-full">
  
    <div class="p-[14px]">
      <h1 class="text-[hsl(218,44%,22%)] font-bold text-xl mb-3">
        Improve your front-end skills by building projects
      </h1>
      <p class="text-[hsl(220,15%,55%)] text-[15px]">
        Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
      </p>
    </div>
  </div>
  
  <div class="attribution mt-8 text-xs">
    Challenge by <a href="..." class="text-blue-600">Frontend Mentor</a>. 
    Coded by <a href="#" class="text-blue-600">M0hamed Yacine</a>.
  </div>

</body>
</html>
